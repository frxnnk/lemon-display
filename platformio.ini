; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:matouch_esp32s3_40]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_USE_MALLOC
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
	bblanchon/ArduinoJson@^7.3.0
	https://github.com/ricmoo/QRCode.git
	me-no-dev/ESPAsyncWebServer@^1.2.3
	me-no-dev/AsyncTCP@^1.1.1
	links2004/WebSockets@^2.4.1
	lovyan03/LovyanGFX@1.1.16

[env:matouch_esp32s3_40_v2_demo]
extends = env:matouch_esp32s3_40
build_flags =
	${env:matouch_esp32s3_40.build_flags}
	-DLEMON_V2_DEMO_MODE=1

[env:matouch_esp32s3_40_v2_real]
extends = env:matouch_esp32s3_40
build_flags =
	${env:matouch_esp32s3_40.build_flags}
	-DLEMON_V2_REAL_MODE=1

; â”€â”€ ferced-display â”€â”€
; Firmware propio: sin escenas de crypto. La entrada es ferced_main.cpp, no
; main.cpp, asi que se excluyen todos los modulos del dashboard de Lemon.
[env:ferced_display]
extends = env:matouch_esp32s3_40
; No hereda build_flags del base a proposito: necesita CDC_ON_BOOT=1 para que
; Serial salga por el USB nativo y se puedan leer los diagnosticos.
build_flags =
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_USE_MALLOC
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DFERCED_DISPLAY=1
build_src_filter =
	+<*>
	-<main.cpp>
	-<v2_runtime.cpp>
	-<ui_v2_runtime.cpp>
	-<ui_v2_settings.cpp>
	-<ui_v2_demo.cpp>
	-<ui_dashboard.cpp>
	-<ui_stocks.cpp>
	-<ui_settings.cpp>
	-<tutorial_overlay.cpp>
	-<config_server.cpp>
	-<ota_manager.cpp>
	-<api_client.cpp>
	-<stocks_client.cpp>
	-<news_client.cpp>
	-<ws_binance.cpp>
	-<app_state.cpp>

; Build de produccion contra el VPS. El endpoint y el token los inyecta
; tools/inject_secrets.py leyendo output/FEED_TOKEN.txt, que no se versiona.
[env:ferced_display_vps]
extends = env:ferced_display
extra_scripts = pre:tools/inject_secrets.py
